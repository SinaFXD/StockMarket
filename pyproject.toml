[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ptm-dashboard"
version = "0.1.0"
description = "Self-updating fundamental dashboard for the ITPM PTM process. Educational tool, not investment advice."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31,<3",
  "pandas>=2.2,<4",
  "PyYAML>=6,<7",
  # Unofficial Yahoo Finance client: no upper bound on purpose, Yahoo changes often and fixes ship fast.
  "yfinance>=0.2.54",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.setuptools.package-data]
pipeline = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
