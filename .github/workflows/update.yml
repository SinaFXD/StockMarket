# Daily data update + website deploy (GitHub Pages). Runs on the default branch only.
#
# - every day after the US close, when manual data or code changes on main, or by hand
#   (Actions -> "Update data & deploy site" -> Run workflow)
# - commits the regenerated site/data/ back to main, then publishes site/ to GitHub Pages
# - a separate job checks data/manual/*.csv; if it finds errors the run turns red (GitHub emails you),
#   but the site is still rebuilt from every valid row
name: Update data & deploy site

on:
  schedule:
    - cron: "23 22 * * *" # 22:23 UTC daily, after the US market close
  push:
    branches: [main]
    paths:
      - "data/manual/**"
      - "pipeline/**"
      - "site/**"
      - "!site/data/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/update.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  check-manual-data:
    name: Check manual data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Validate data/manual/*.csv
        run: python -m pipeline.manual --check

  build:
    name: Fetch data & build site
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write # commit site/data back to main
      pages: read # configure-pages checks that Pages is enabled
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest

      - name: Restore raw-data cache (last good copies)
        uses: actions/cache/restore@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}
          restore-keys: raw-data-
      - name: Run pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m pipeline.run
      - name: Save raw-data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw
          key: raw-data-${{ github.run_id }}

      - name: Commit updated data
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f site/data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -q -m "data: automatic update $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            echo "Push failed (attempt $attempt), retrying..."
            sleep $((attempt * 10))
          done
          exit 1

      - name: Configure GitHub Pages (if this fails, enable Pages - see docs/06-setup.md)
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
