# Series fetched automatically every day. IDs verified live on 2026-10-20 (UMich and Eurostat on 2026-10-22).
#
# Fields: id (source's own ID), label (our short English name), block (dashboard block, see catalog.py),
# vintages: true  -> also download ALFRED real-time vintages (for honest backtests; FRED only),
# max_age_days: N -> override the staleness threshold from config.MAX_AGE_DAYS for slow publishers.
#
# Manual indicators (ISM, NFIB, China PMIs) are NOT here: they live in data/manual/*.csv.

fred:
  # --- US money markets (lessons 4-6, VIX) ---
  - {id: DGS10, label: "US 10y Treasury yield", block: money_markets}
  - {id: DGS2, label: "US 2y Treasury yield", block: money_markets}
  - {id: DGS3MO, label: "US 3m Treasury yield", block: money_markets}
  - {id: DGS1MO, label: "US 1m Treasury yield", block: money_markets}
  - {id: DGS6MO, label: "US 6m Treasury yield", block: money_markets}
  - {id: T10Y2Y, label: "Yield curve 10y-2y", block: money_markets}
  - {id: T10Y3M, label: "Yield curve 10y-3m", block: money_markets}
  - {id: DFII10, label: "US 10y TIPS real yield", block: money_markets}
  - {id: CPIAUCSL, label: "US CPI (headline)", block: money_markets, vintages: true}
  - {id: CPILFESL, label: "US CPI (core)", block: money_markets}
  - {id: DFF, label: "Fed funds effective rate (daily)", block: money_markets}
  - {id: FEDFUNDS, label: "Fed funds effective rate (monthly)", block: money_markets}
  - {id: WALCL, label: "Fed balance sheet (total assets)", block: money_markets}
  - {id: BAMLC0A2CAA, label: "AA corporate OAS", block: money_markets}
  - {id: BAMLC0A4CBBB, label: "BBB corporate OAS", block: money_markets}
  - {id: BAMLH0A3HYC, label: "CCC & lower high-yield OAS", block: money_markets}
  - {id: BAMLC0A0CM, label: "Investment-grade corporate OAS", block: money_markets}
  - {id: BAMLH0A0HYM2, label: "High-yield OAS", block: money_markets}
  - {id: BAA10Y, label: "Moody's Baa minus 10y (long history)", block: money_markets}
  - {id: AAA10Y, label: "Moody's Aaa minus 10y (long history)", block: money_markets}
  - {id: M2SL, label: "M2 money supply", block: money_markets, vintages: true}
  - {id: VIXCLS, label: "VIX (FRED)", block: money_markets}

  # --- US surveys (lessons 9-10; ISM and NFIB are manual) ---
  - {id: UMCSENT, label: "UMich consumer sentiment", block: surveys, vintages: true, max_age_days: 110}
  - {id: PERMIT, label: "Building permits (total)", block: surveys, vintages: true}
  - {id: PERMIT1, label: "Building permits (1-unit)", block: surveys}
  - {id: HOUST, label: "Housing starts", block: surveys}
  - {id: COMPUTSA, label: "Housing completions", block: surveys}

  # --- Cyclical commodities & the dollar (lesson 12) ---
  - {id: DCOILWTICO, label: "WTI crude oil (EIA)", block: prices_fx_equities, max_age_days: 14}
  - {id: DCOILBRENTEU, label: "Brent crude oil (EIA)", block: prices_fx_equities, max_age_days: 14}
  - {id: PCOPPUSDM, label: "Copper, global price (IMF)", block: prices_fx_equities, max_age_days: 140}
  - {id: PIORECRUSDM, label: "Iron ore, global price (IMF)", block: prices_fx_equities, vintages: true, max_age_days: 140}
  - {id: WPU081, label: "PPI lumber", block: prices_fx_equities, vintages: true}
  - {id: PPIFIS, label: "PPI final demand", block: prices_fx_equities}
  - {id: DTWEXBGS, label: "US dollar, broad index", block: prices_fx_equities}
  - {id: DTWEXAFEGS, label: "US dollar vs advanced economies", block: prices_fx_equities}
  - {id: DTWEXEMEGS, label: "US dollar vs emerging markets", block: prices_fx_equities}

  # --- Coincident & lagging confirmers (lessons 3, 15) ---
  - {id: PAYEMS, label: "Nonfarm payrolls", block: confirmers, vintages: true}
  - {id: UNRATE, label: "Unemployment rate", block: confirmers, vintages: true}
  - {id: ICSA, label: "Initial jobless claims", block: confirmers}
  - {id: CCSA, label: "Continuing jobless claims", block: confirmers}
  - {id: DGORDER, label: "Durable goods orders", block: confirmers, max_age_days: 110}
  - {id: INDPRO, label: "Industrial production", block: confirmers, vintages: true}
  - {id: GDPC1, label: "Real GDP", block: confirmers, vintages: true}
  - {id: CP, label: "Corporate profits after tax", block: confirmers}

